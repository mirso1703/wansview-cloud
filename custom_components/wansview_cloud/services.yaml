raw_request:
  fields:
    url:
      required: true
      example: "/v2/device-list"
      selector:
        text:
    data:
      selector:
        object:

save_image:
  fields:
    entity_id:
      selector:
        entity:
          domain: [camera, image]
    source:
      example: "/media/wansview/Kuća Parking/2026-11-23/13-47-14.jpg"
      selector:
        text:
    filename:
      required: true
      example: "/media/vozila/A12K345.jpg"
      selector:
        text:
    box:
      example: "[300, 200, 700, 600]"
      selector:
        object:
    only_if_better:
      selector:
        boolean:
latest_image:
  fields:
    camera:
      required: true
      example: "Kuća Parking"
      selector:
        text:
video_frame:
  fields:
    source:
      required: true
      example: "/media/wansview/Obala/2026-11-27/13-16-02.mp4"
      selector:
        text:
    filename:
      required: true
      example: "/media/zivotinje/_kadar_obala.jpg"
      selector:
        text:
    at:
      example: 1.0
      selector:
        number:
          min: 0
          max: 60
          step: 0.5
    wait:
      example: 60
      selector:
        number:
          min: 0
          max: 180
